[package]
name = "donovan-pos"
version = "2.3.0"
edition = "2024"
default-run = "DonovanPOS"
authors = ["Donovan Systems"]
description = "Donovan POS Pro — aplicación local de punto de venta"
license = "LicenseRef-Proprietary"

[lib]
name = "donovan_core"
path = "src/lib.rs"

[[bin]]
name = "DonovanPOS"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:rfd", "dep:webview2-com", "dep:windows-core"]
custom-protocol = ["desktop", "tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", optional = true , features = [] }

[dependencies]
tauri = { version = "2", optional = true , features = [] }
rfd = { version = "0.15", optional = true }
rusqlite = { version = "0.38", features = ["bundled", "backup", "functions", "limits"] }
mysql = { version = "28.0.4", default-features = false, features = ["minimal-rust", "rustls-tls-ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
pbkdf2 = "0.12"
rand = "0.8"
base64 = "0.22"
subtle = "2"
zeroize = "1"
zip = { version = "4", default-features = false, features = ["deflate"] }
unicode-normalization = "0.1"
fs2 = "0.4"
calamine = "0.31"
quick-xml = "0.38"
rust_xlsxwriter = "0.92"
lopdf = "0.38"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
barcoders = "2"
ttf-parser = "0.25.1"

[target.'cfg(windows)'.dependencies]
webview2-com = {version = "0.39.1", optional = true}
windows-core = {version = "0.62.2", optional = true}
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_Foundation", "Win32_System_Memory", "Win32_Storage_FileSystem", "Win32_Graphics_Gdi", "Win32_Graphics_Printing", "Win32_Storage_Xps"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 8
panic = "unwind"
